<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Circuit Drill</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1F1D">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --panel-bg:#15181a;
    --card-bg:#20241f;
    --card-bg-2:#262b26;
    --copper:#c97c3d;
    --copper-bright:#e0954f;
    --amber:#e8a93b;
    --circuit-green:#5b8c5a;
    --fault-red:#c2543a;
    --insulation:#ede7da;
    --insulation-dim:#a9a397;
    --line:#3a4038;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--panel-bg);
    color:var(--insulation);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;
    user-select:none;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(201,124,61,0.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(91,140,90,0.05), transparent 40%);
  }
  .topbar{
    padding:18px 18px 10px 18px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .brand h1{
    font-family:"Arial Black",Impact,"Segoe UI",sans-serif;
    font-weight:900;
    font-size:20px;
    letter-spacing:1.5px;
    margin:0;
    color:var(--copper-bright);
    text-transform:uppercase;
  }
  .brand .tag{
    font-family:"SF Mono",Consolas,monospace;
    font-size:11px;
    color:var(--insulation-dim);
    letter-spacing:1px;
  }

  /* Breaker panel progress row -- signature element */
  .breaker-row{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:14px;
  }
  .breaker{
    width:7px;
    height:16px;
    border-radius:1px;
    background:var(--line);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
    transition: background 0.25s ease, transform 0.15s ease;
  }
  .breaker.done{
    background:var(--copper);
  }
  .breaker.current{
    background:var(--amber);
    transform:translateY(-2px);
  }

  .stats-line{
    display:flex;
    gap:16px;
    margin-top:10px;
    font-family:"SF Mono",Consolas,monospace;
    font-size:11px;
    color:var(--insulation-dim);
  }
  .stats-line b{ color:var(--insulation); }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px 18px 28px 18px;
    max-width:560px;
    width:100%;
    margin:0 auto;
  }

  .qnum{
    font-family:"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--copper);
    letter-spacing:1px;
    margin-bottom:10px;
  }
  .qtext{
    font-size:19px;
    line-height:1.4;
    font-weight:600;
    color:var(--insulation);
    margin-bottom:22px;
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice-btn{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    color:var(--insulation);
    font-size:16px;
    font-family:inherit;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
  }
  .choice-btn:active{ transform:scale(0.98); }
  .choice-btn .letter{
    font-family:"SF Mono",Consolas,monospace;
    font-weight:700;
    color:var(--copper);
    min-width:18px;
  }
  .choice-btn.correct{
    background:rgba(91,140,90,0.18);
    border-color:var(--circuit-green);
  }
  .choice-btn.correct .letter{ color:var(--circuit-green); }
  .choice-btn.incorrect{
    background:rgba(194,84,58,0.18);
    border-color:var(--fault-red);
  }
  .choice-btn.incorrect .letter{ color:var(--fault-red); }
  .choice-btn:disabled{ cursor:default; }

  .feedback{
    margin-top:16px;
    min-height:24px;
    font-family:"SF Mono",Consolas,monospace;
    font-size:13px;
    letter-spacing:0.3px;
  }
  .feedback.correct{ color:var(--circuit-green); }
  .feedback.incorrect{ color:var(--fault-red); }

  .next-btn{
    margin-top:20px;
    align-self:flex-start;
    background:var(--copper);
    color:#1B1F1D;
    border:none;
    border-radius:8px;
    padding:12px 22px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{ display:inline-block; }

  /* Summary screen */
  .summary{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  .summary.show{ display:flex; }

  .gauge-wrap{ position:relative; width:200px; height:200px; margin-bottom:8px; }
  .gauge-pct{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family:"SF Mono",Consolas,monospace;
    font-size:34px;
    font-weight:700;
    color:var(--copper-bright);
  }
  .gauge-label{
    position:absolute; top:65%; left:50%; transform:translate(-50%,-50%);
    font-size:11px;
    color:var(--insulation-dim);
    letter-spacing:1px;
  }

  .summary h2{
    font-family:"Arial Black",Impact,sans-serif;
    font-size:20px;
    letter-spacing:1px;
    margin:14px 0 4px 0;
    color:var(--insulation);
    text-transform:uppercase;
  }
  .summary p.verdict{
    color:var(--insulation-dim);
    font-size:14px;
    max-width:320px;
    margin:0 0 24px 0;
  }
  .summary-stats{
    display:flex;
    gap:24px;
    margin-bottom:30px;
  }
  .summary-stats div{
    font-family:"SF Mono",Consolas,monospace;
    text-align:center;
  }
  .summary-stats .num{
    font-size:22px;
    font-weight:700;
  }
  .summary-stats .lbl{
    font-size:10px;
    color:var(--insulation-dim);
    letter-spacing:1px;
    margin-top:2px;
  }
  .num.g{ color:var(--circuit-green); }
  .num.r{ color:var(--fault-red); }

  .again-row{ display:flex; gap:12px; }
  .again-btn{
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--insulation);
    padding:13px 26px;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .again-btn.primary{
    background:var(--copper);
    color:#1B1F1D;
    border:none;
  }

  .footer-note{
    text-align:center;
    font-size:10px;
    color:var(--insulation-dim);
    padding:10px;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>Circuit Drill</h1>
    <span class="tag">ELECTRICAL CODE PRACTICE</span>
  </div>
  <div class="breaker-row" id="breakerRow"></div>
  <div class="stats-line">
    <span>CORRECT <b id="statCorrect">0</b></span>
    <span>MISSED <b id="statIncorrect">0</b></span>
    <span>LEFT <b id="statRemaining">0</b></span>
  </div>
</div>

<main id="quizScreen">
  <div class="qnum" id="qnum">QUESTION 1</div>
  <div class="qtext" id="qtext">Loading...</div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn">NEXT QUESTION &rarr;</button>
</main>

<div class="summary" id="summaryScreen">
  <div class="gauge-wrap">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="86" fill="none" stroke="#3a4038" stroke-width="14"/>
      <circle id="gaugeArc" cx="100" cy="100" r="86" fill="none" stroke="#c97c3d" stroke-width="14"
        stroke-linecap="round" transform="rotate(-90 100 100)"/>
    </svg>
    <div class="gauge-pct" id="gaugePct">0%</div>
    <div class="gauge-label">ACCURACY</div>
  </div>
  <h2>Panel Cleared</h2>
  <p class="verdict" id="verdict">Every circuit checked.</p>
  <div class="summary-stats">
    <div><div class="num g" id="sumCorrect">0</div><div class="lbl">CORRECT</div></div>
    <div><div class="num r" id="sumIncorrect">0</div><div class="lbl">MISSED</div></div>
    <div><div class="num" id="sumTotal">0</div><div class="lbl">QUESTIONS</div></div>
  </div>
  <div class="again-row">
    <button class="again-btn primary" id="againYes">RUN IT AGAIN</button>
    <button class="again-btn" id="againNo">DONE FOR NOW</button>
  </div>
</div>

<div class="footer-note">No question repeats until every breaker's been tripped once.</div>

let order = [];
let posInOrder = 0;
let results = []; // per original-order index: {done:bool}
let correctCount = 0;
let incorrectCount = 0; // total wrong guesses this round
let currentWrongOnThis = false;

const qnumEl = document.getElementById('qnum');
const qtextEl = document.getElementById('qtext');
const choicesEl = document.getElementById('choices');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const breakerRow = document.getElementById('breakerRow');
const statCorrect = document.getElementById('statCorrect');
const statIncorrect = document.getElementById('statIncorrect');
const statRemaining = document.getElementById('statRemaining');
const quizScreen = document.getElementById('quizScreen');
const summaryScreen = document.getElementById('summaryScreen');

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startRound(){
  order = shuffle(QUESTIONS.map((_,i)=>i));
  posInOrder = 0;
  correctCount = 0;
  incorrectCount = 0;
  buildBreakerRow();
  quizScreen.style.display='flex';
  quizScreen.style.flexDirection='column';
  summaryScreen.classList.remove('show');
  renderQuestion();
  updateStats();
}

function buildBreakerRow(){
  breakerRow.innerHTML='';
  for(let i=0;i<order.length;i++){
    const d=document.createElement('div');
    d.className='breaker';
    d.id='brk-'+i;
    breakerRow.appendChild(d);
  }
}

function updateBreakers(){
  for(let i=0;i<order.length;i++){
    const el=document.getElementById('brk-'+i);
    el.classList.remove('current','done');
    if(i<posInOrder) el.classList.add('done');
    else if(i===posInOrder) el.classList.add('current');
  }
}

function updateStats(){
  statCorrect.textContent = correctCount;
  statIncorrect.textContent = incorrectCount;
  statRemaining.textContent = order.length - posInOrder;
}

function renderQuestion(){
  currentWrongOnThis = false;
  const qIndex = order[posInOrder];
  const q = QUESTIONS[qIndex];
  qnumEl.textContent = 'QUESTION ' + (posInOrder+1) + ' OF ' + order.length;
  qtextEl.textContent = q.text;
  choicesEl.innerHTML='';
  feedbackEl.textContent='';
  feedbackEl.className='feedback';
  nextBtn.classList.remove('show');
  updateBreakers();
  updateStats();

  q.choices.forEach((choiceText)=>{
    const letter = choiceText.trim().charAt(0);
    const rest = choiceText.trim().slice(2).trim();
    const btn = document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML = '<span class="letter">'+letter+'</span><span>'+rest+'</span>';
    btn.onclick = ()=>handleAnswer(letter, q, btn);
    choicesEl.appendChild(btn);
  });
}

function handleAnswer(letter, q, btnEl){
  const buttons = choicesEl.querySelectorAll('.choice-btn');
  buttons.forEach(b=>b.disabled=true);

  if(letter === q.answer){
    btnEl.classList.add('correct');
    feedbackEl.textContent = pickLine(CORRECT_LINES);
    feedbackEl.className = 'feedback correct';
    correctCount++;
    nextBtn.classList.add('show');
    nextBtn.onclick = ()=>{
      posInOrder++;
      updateStats();
      if(posInOrder >= order.length){
        showSummary();
      } else {
        renderQuestion();
      }
    };
  } else {
    btnEl.classList.add('incorrect');
    buttons.forEach(b=>{
      const l = b.querySelector('.letter').textContent;
      if(l === q.answer) b.classList.add('correct');
    });
    feedbackEl.textContent = pickLine(INCORRECT_LINES);
    feedbackEl.className = 'feedback incorrect';
    incorrectCount++;
    currentWrongOnThis = true;
    nextBtn.classList.add('show');
    nextBtn.textContent = 'TRY AGAIN \u2192';
    nextBtn.onclick = ()=>{
      nextBtn.textContent = 'NEXT QUESTION \u2192';
      renderQuestion();
    };
  }
  updateStats();
}

const CORRECT_LINES = [
  "Correct! Shockingly good work.",
  "Correct! You're really wired for this.",
  "Correct! Current status: crushing it.",
  "Correct! No shorts in that answer.",
  "Correct! That one was grounded in fact."
];
const INCORRECT_LINES = [
  "Incorrect. Let's re-close that circuit and try again.",
  "Incorrect. Don't worry, even breakers trip sometimes.",
  "Incorrect. Give it another jolt.",
  "Incorrect. That answer got grounded out.",
  "Incorrect. Reset and retry."
];
function pickLine(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function showSummary(){
  quizScreen.style.display='none';
  summaryScreen.classList.add('show');

  const total = correctCount + incorrectCount;
  const pct = total>0 ? Math.round((correctCount/total)*1000)/10 : 0;

  document.getElementById('sumCorrect').textContent = correctCount;
  document.getElementById('sumIncorrect').textContent = incorrectCount;
  document.getElementById('sumTotal').textContent = order.length;
  document.getElementById('gaugePct').textContent = pct + '%';

  const circumference = 2 * Math.PI * 86;
  const arc = document.getElementById('gaugeArc');
  arc.style.strokeDasharray = circumference;
  arc.style.strokeDashoffset = circumference * (1 - pct/100);
  arc.style.transition = 'stroke-dashoffset 0.8s ease';

  const verdict = document.getElementById('verdict');
  if(pct>=90){
    verdict.textContent = 'Master electrician material right there.';
    arc.style.stroke = 'var(--circuit-green)';
  } else if(pct>=70){
    verdict.textContent = "Solid work \u2014 a little more studying and you'll be golden.";
    arc.style.stroke = 'var(--amber)';
  } else {
    verdict.textContent = 'Keep at it \u2014 every trip of the breaker teaches you something.';
    arc.style.stroke = 'var(--fault-red)';
  }
}

document.getElementById('againYes').onclick = startRound;
document.getElementById('againNo').onclick = ()=>{
  summaryScreen.innerHTML = '<div style="font-family:\'SF Mono\',Consolas,monospace;color:var(--insulation-dim);text-align:center;padding:40px;">Session closed.<br>Reopen the app anytime to run it again.</div>';
};

}

startRound();
